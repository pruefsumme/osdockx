[package]
name = "osdockx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight, customizable OSX-inspired dock for Linux/X11."

[dependencies]
anyhow = "1.0"
directories = "6.0"
gdk-x11 = { package = "gdk4-x11", version = "0.11.0", features = ["xlib"] }
gio-unix = "0.22"
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_12"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = { version = "0.13.2", features = ["randr", "shape"] }

[dev-dependencies]
tempfile = "3.20"
